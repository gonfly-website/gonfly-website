:root{--navy:#11152b;--red:#ed1b2f;--muted:#667085;--gold:#d7b46a}*{box-sizing:border-box}body{margin:0;background:#f4f5f8;color:#15182f;font:16px/1.6 Arial,sans-serif}.top{background:#050507;color:white;padding:14px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.logo img{width:140px;height:52px;object-fit:contain}.top a{color:white;text-decoration:none}.wrap{max-width:1100px;margin:28px auto;padding:0 18px 45px}.hero{position:relative;background:var(--navy);color:white;border-radius:20px;overflow:hidden;display:block;min-height:360px;isolation:isolate}.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,11,24,.88) 0%,rgba(8,11,24,.62) 55%,rgba(8,11,24,.16) 100%);z-index:1;pointer-events:none}.hero-copy{position:relative;z-index:2;padding:clamp(28px,4vw,48px);max-width:850px;min-height:360px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.15;margin:10px 0}.hero p{color:#e0e4f0}.hero img{position:absolute;inset:0;width:100%;height:100%;min-height:100%;max-height:none;object-fit:cover;object-position:center;z-index:0}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-weight:bold}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chip{border:1px solid #ffffff30;border-radius:99px;padding:5px 10px;font-size:13px}.columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,.8fr);gap:20px;margin-top:20px}.panel,.price{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:22px;margin-bottom:18px}.panel h2,.price h2{margin:0 0 12px}.price{padding:0;overflow:hidden;align-self:start}.pricehead{background:var(--navy);color:white;padding:22px}.pricehead p{color:#e0e4f0}.pricebody{padding:22px}.fee,.total{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf0f4}.total{font-size:20px;font-weight:bold;border:0;padding-top:18px}.note{font-size:13px;color:var(--muted)}.btn{display:inline-block;background:var(--red);color:white;text-decoration:none;border-radius:99px;padding:12px 18px;font-weight:bold;margin:6px 8px 0 0}.btn.dark{background:var(--navy)}li{margin:7px 0}.loading{max-width:650px;margin:15vh auto;background:white;border-radius:18px;padding:28px;text-align:center}@media(max-width:740px){.columns{grid-template-columns:1fr}.hero{min-height:320px}.hero::before{background:linear-gradient(90deg,rgba(8,11,24,.84),rgba(8,11,24,.42))}.hero-copy{padding:24px;min-height:320px}.hero img{min-height:100%;max-height:none;object-position:center}}

<script>
(function(){
 const base='https://jhyykuecimynewkhvkzi.supabase.co/rest/v1/visa_missions';
 const key='sb_publishable_S19JBZII2pLGUXVBPRxVhg_YQzqvbVM';
 const params=new URLSearchParams(location.search);
 const slug=(params.get('mission')||'').trim().toLowerCase();
 const country=(params.get('country')||'').trim();
 const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0);
 const total=p=>['visa_fee','service_fee','verification_fee','convenience_fee','other_fee'].reduce((s,k)=>s+Math.max(0,Number((p||{})[k])||0),0);
 function fallback(){
  const k=country.toLowerCase().replace(/[^a-z]/g,''),routes={georgia:'visa/georgia.html',vietnam:'visa/vietnam.html',uzbekistan:'visa/uzbekistan.html',indonesia:'visa/indonesia.html',azerbaijan:'visa/azerbaijan.html',uae:'visa/uae.html',unitedarabemirates:'visa/uae.html'};
  if(routes[k]){location.replace(routes[k]);return;}
  document.getElementById('app').innerHTML='<section class="loading"><h1>Visa details are not available yet</h1><p>No approved mission was found for '+esc(country||slug||'this destination')+'. Please contact GoNfly to confirm availability.</p><a class="btn" href="index.html#visa-services">Browse visa services</a></section>';
 }
 function render(m){
  const p=m.pricing||{},docs=Array.isArray(m.documents)?m.documents:[],fees=[['Visa fee',p.visa_fee],['GoNfly service fee',p.service_fee],['Verification fee',p.verification_fee],['Convenience fee',p.convenience_fee],['Other fees / tax',p.other_fee]],img=(m.image_url||'').trim();
  const image=/^https?:\/\//i.test(img)?'<img src="'+esc(img)+'" alt="'+esc(m.country)+' destination">':'';
  const pageTitle=m.country+' '+(m.visa_type||'Visa')+' | GoNfly';
  const pageDescription=(m.description||('Current listed details and pricing for GoNfly-approved '+m.country+' visa assistance.')).replace(/\s+/g,' ').trim().slice(0,300);
  const canonical='https://gonflytravel.com/visa-details.html?mission='+encodeURIComponent(m.slug);
  document.title=pageTitle;
  document.getElementById('page-description').content=pageDescription;
  document.getElementById('page-canonical').href=canonical;
  document.getElementById('og-title').content=pageTitle;
  document.getElementById('og-description').content=pageDescription;
  document.getElementById('og-url').content=canonical;
  if(/^https?:\/\//i.test(img))document.getElementById('og-image').content=img;
  document.getElementById('app').innerHTML='<header class="top"><a class="logo" href="index.html"><img src="logo-approved.webp" alt="GoNfly"></a><a href="index.html#visa-services">← All visa services</a></header><main class="wrap"><p><a href="index.html">Home</a> / Visa assistance / '+esc(m.country)+'</p><section class="hero"><div class="hero-copy"><div class="eyebrow">GoNfly Visa Assistance</div><h1>'+esc(m.country)+' '+esc(m.visa_type||'Visa')+'</h1><p>'+esc(m.description||('GoNfly visa assistance for '+m.country+'.'))+'</p><div class="chips"><span class="chip">Processing: '+esc(m.processing_time||'To be confirmed')+'</span><span class="chip">'+esc(m.entry_type||'Entry type TBC')+'</span><span class="chip">Validity: '+esc(m.validity||'TBC')+'</span><span class="chip">Stay: '+esc(m.permitted_stay||'TBC')+'</span></div></div>'+image+'</section><div class="columns"><div><section class="panel"><h2>Required documents</h2>'+(docs.length?'<ul>'+docs.map(d=>'<li>'+esc(typeof d==='string'?d:(d.name||d.title||JSON.stringify(d)))+'</li>').join('')+'</ul>':'<p>Contact GoNfly to confirm requirements for your passport nationality.</p>')+'</section>'+(m.notes?'<section class="panel"><h2>Important notes</h2><p>'+esc(m.notes)+'</p></section>':'')+'<section class="panel"><h2>Before you apply</h2><p>Eligibility and final requirements depend on passport nationality and destination authorities. Processing times and fees may change. Confirm the latest requirements and final amount with GoNfly before payment.</p><a class="btn" href="https://wa.me/919999962722?text='+encodeURIComponent('Hello GoNfly, I need '+m.country+' '+(m.visa_type||'visa')+' assistance.')+'" target="_blank" rel="noopener noreferrer">Enquire on WhatsApp</a><a class="btn dark" href="mailto:gonfly.info@gmail.com?subject='+encodeURIComponent(m.country+' Visa Enquiry')+'">Email GoNfly</a></section></div><aside class="price"><div class="pricehead"><div class="eyebrow">Transparent pricing</div><h2>'+esc(m.country)+' Visa</h2><p>'+esc(m.visa_type||'Visa assistance')+'</p></div><div class="pricebody">'+fees.filter(x=>Number(x[1])>0).map(x=>'<div class="fee"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>').join('')+'<div class="total"><span>Total</span><b>'+money(total(p))+'</b></div><p class="note">Confirm the final payable amount and government charges with GoNfly before payment.</p><a class="btn" href="https://wa.me/919999962722?text='+encodeURIComponent('Hello GoNfly, please confirm the final price for '+m.country+' '+(m.visa_type||'visa')+'.')+'" target="_blank" rel="noopener noreferrer">Confirm price</a></div></aside></div></main>';
  const heroImage=document.querySelector('.hero img');if(heroImage)heroImage.addEventListener('error',()=>heroImage.remove(),{once:true});
 }
 async function load(){
  if(!slug&&!country){fallback();return;}
  const q=new URLSearchParams({select:'country,slug,visa_type,processing_time,entry_type,validity,permitted_stay,description,pricing,documents,notes,image_url,status',status:'eq.approved',limit:'1'});
  if(slug)q.set('slug','eq.'+slug);else q.set('country','eq.'+country);
  try{const r=await fetch(base+'?'+q,{headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();if(Array.isArray(rows)&&rows.length&&rows[0].status==='approved'){render(rows[0]);return;}}catch(e){console.warn('Approved mission lookup failed; using legacy fallback.',e);}
  fallback();
 }
 document.addEventListener('DOMContentLoaded',load);
})();
</script></head><body><div id="app"><section class="loading"><h1>Loading visa details…</h1><p>Fetching the latest approved mission details.</p></section></div></body></html>
